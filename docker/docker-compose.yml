version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    env_file:
      - ../config/.env
    environment:
      - SESSION_COOKIE=${SESSION_COOKIE}
      - AUTHORIZE_TOKEN=${AUTHORIZE_TOKEN}
      - CLIENT_SOURCE_TOKEN=${CLIENT_SOURCE_TOKEN}
    depends_on:
      - session
      - proxy
    networks:
      - randevu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ../config/.env
    environment:
      - CHECK_INTERVAL=${CHECK_INTERVAL:-45}
      - SESSION_COOKIE=${SESSION_COOKIE}
      - AUTHORIZE_TOKEN=${AUTHORIZE_TOKEN}
      - CLIENT_SOURCE_TOKEN=${CLIENT_SOURCE_TOKEN}
    depends_on:
      - api
      - session
      - proxy
    networks:
      - randevu-network
    restart: unless-stopped

  session:
    build:
      context: ..
      dockerfile: docker/Dockerfile.session
    ports:
      - "8081:8081"
    networks:
      - randevu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    ports:
      - "8082:8082"
    env_file:
      - ../config/.env
    environment:
      - PROXY_LIST=${PROXY_LIST}
    networks:
      - randevu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  randevu-network:
    driver: bridge
